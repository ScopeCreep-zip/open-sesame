[package]
name = "daemon-clipboard"
description = "Clipboard history daemon: Wayland clipboard capture into per-profile history"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
core-types = { workspace = true }
core-config = { workspace = true }
core-daemon = { workspace = true }
core-ipc = { workspace = true }
core-layout = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# desktop: clipboard capture (data-control).
platform-linux = { workspace = true, features = ["desktop"] }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
