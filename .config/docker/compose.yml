# Open Sesame package install verification
#
# Tests .deb and .rpm packages from GitHub Releases against
# Ubuntu and Fedora containers with systemd as PID 1.
#
# Each container runs:
# - systemd for service lifecycle
# - D-Bus user session for IPC
# - SSH agent with generated keypair
# - sesame-init.service for non-interactive vault creation
# - All open-sesame daemons via systemd global enable
#
# Usage:
#   OPEN_SESAME_VERSION=1.15.3 docker compose -f .config/docker/compose.yml up --build -d
#   docker exec --user ubuntu open-sesame-ubuntu sesame status
#   docker exec --user testuser open-sesame-fedora sesame status
#   docker compose -f .config/docker/compose.yml down -v

services:
  ubuntu:
    build:
      context: ../..
      dockerfile: .config/docker/Dockerfile.ubuntu
      args:
        VERSION: "${OPEN_SESAME_VERSION}"
        ARCH: "${OPEN_SESAME_ARCH:-x86_64}"
    container_name: open-sesame-ubuntu
    hostname: ubuntu
    init: false
    restart: unless-stopped
    stop_signal: SIGRTMIN+3
    stop_grace_period: 15s
    privileged: true
    environment:
      container: docker
    volumes:
      - ubuntu-config:/home/ubuntu/.config/pds
      - ubuntu-cache:/home/ubuntu/.cache/open-sesame
    tmpfs:
      - /run:exec,mode=755
      - /run/lock:exec,mode=755
      - /tmp:exec,mode=1777

  fedora:
    build:
      context: ../..
      dockerfile: .config/docker/Dockerfile.fedora
      args:
        VERSION: "${OPEN_SESAME_VERSION}"
        ARCH: "${OPEN_SESAME_ARCH:-x86_64}"
    container_name: open-sesame-fedora
    hostname: fedora
    init: false
    restart: unless-stopped
    stop_signal: SIGRTMIN+3
    stop_grace_period: 15s
    privileged: true
    environment:
      container: docker
    volumes:
      - fedora-config:/home/testuser/.config/pds
      - fedora-cache:/home/testuser/.cache/open-sesame
    tmpfs:
      - /run:exec,mode=755
      - /run/lock:exec,mode=755
      - /tmp:exec,mode=1777

volumes:
  ubuntu-config:
    driver: local
  ubuntu-cache:
    driver: local
  fedora-config:
    driver: local
  fedora-cache:
    driver: local
