# Fedora -- install from locally prebuilt .rpm packages
#
# Packages: $SESAME_PACKAGES, default target/generate-rpm (mise run build:rpm)
#
# mise run test:docker:fedora:local
# scripts/docker/verify-install.sh fedora local <DIR>

services:
  fedora-local:
    build:
      context: ../../..
      dockerfile: .config/docker/Dockerfile.fedora
    container_name: open-sesame-fedora-local
    hostname: fedora-local
    init: false
    restart: unless-stopped
    stop_signal: SIGRTMIN+3
    stop_grace_period: 15s
    privileged: true
    environment:
      container: docker
    volumes:
      - ${SESAME_PACKAGES:-../../../target/generate-rpm}:/packages:ro
      - fedora-local-config:/home/fedora/.config/pds
      - fedora-local-cache:/home/fedora/.cache/open-sesame
    tmpfs:
      - /run:exec,mode=755
      - /run/lock:exec,mode=755
      - /tmp:exec,mode=1777

volumes:
  fedora-local-config:
    driver: local
  fedora-local-cache:
    driver: local
