# Arch -- install from locally prebuilt .pkg.tar.zst packages
#
# Packages: $SESAME_PACKAGES, default target/arch (mise run test:arch:pkg,
# which builds them from the mise run build:arch tarballs)
#
# mise run test:docker:arch:local
# scripts/docker/verify-install.sh arch local <DIR>

services:
  arch-local:
    build:
      context: ../../..
      dockerfile: .config/docker/Dockerfile.arch
    container_name: open-sesame-arch-local
    hostname: arch-local
    init: false
    restart: unless-stopped
    stop_signal: SIGRTMIN+3
    stop_grace_period: 15s
    privileged: true
    environment:
      container: docker
    volumes:
      - ${SESAME_PACKAGES:-../../../target/arch}:/packages:ro
      - arch-local-config:/home/arch/.config/pds
      - arch-local-cache:/home/arch/.cache/open-sesame
    tmpfs:
      - /run:exec,mode=755
      - /run/lock:exec,mode=755
      - /tmp:exec,mode=1777

volumes:
  arch-local-config:
    driver: local
  arch-local-cache:
    driver: local
