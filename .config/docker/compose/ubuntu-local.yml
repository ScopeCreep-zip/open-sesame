# Ubuntu -- install from locally prebuilt .deb packages
#
# Packages: $SESAME_PACKAGES, default target/debian (mise run build:deb)
#
# mise run test:docker:ubuntu:local
# scripts/docker/verify-install.sh ubuntu local <DIR>

services:
  ubuntu-local:
    build:
      context: ../../..
      dockerfile: .config/docker/Dockerfile.ubuntu
      # systemd and the user only: the packages under test install over
      # nothing of open-sesame.
      target: base
    container_name: open-sesame-ubuntu-local
    hostname: ubuntu-local
    init: false
    restart: unless-stopped
    stop_signal: SIGRTMIN+3
    stop_grace_period: 15s
    privileged: true
    environment:
      container: docker
    volumes:
      - ${SESAME_PACKAGES:-../../../target/debian}:/packages:ro
      - ubuntu-local-config:/home/ubuntu/.config/pds
      - ubuntu-local-cache:/home/ubuntu/.cache/open-sesame
    tmpfs:
      - /run:exec,mode=755
      - /run/lock:exec,mode=755
      - /tmp:exec,mode=1777

volumes:
  ubuntu-local-config:
    driver: local
  ubuntu-local-cache:
    driver: local
