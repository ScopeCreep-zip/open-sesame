[package]
name = "daemon-secrets"
description = "Secrets broker daemon: SQLCipher vaults, multi-factor unlock, profile-scoped access"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
core-types = { workspace = true }
core-config = { workspace = true }
core-daemon = { workspace = true }
core-layout = { workspace = true }
core-ipc = { workspace = true }
core-crypto = { workspace = true }
core-auth = { workspace = true }
core-secrets = { workspace = true }
# rt-multi-thread: `#[tokio::main]` runs on the multi-threaded runtime.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
governor = { workspace = true }

[features]
## Per-field AES-256-GCM encryption of secret values on the IPC bus,
## layered on top of Noise IK transport encryption (ADR-SEC-006).
## Default off: the Noise transport is the security boundary, matching
## ssh-agent/1Password/Vault/gpg-agent precedent. Enable for research
## into defense-in-depth for daemon-to-daemon relay scenarios.
ipc-field-encryption = []

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
