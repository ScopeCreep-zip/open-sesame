name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run semantic-release in dry-run mode'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write
  issues: write
  pull-requests: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

jobs:
  # ==========================================================================
  # Semantic Release - analyze commits and create GitHub release with tag
  # ==========================================================================
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      new_release: ${{ steps.release.outputs.new_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "node"

      - name: Install semantic-release plugins
        run: mise run setup:npm

      - name: Semantic Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            npx semantic-release --dry-run 2>&1 | tee release-output.txt
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            npx semantic-release 2>&1 | tee release-output.txt
            if grep -q "Published release" release-output.txt; then
              VERSION=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' release-output.txt || true)
              {
                echo "new_release=true"
                echo "version=${VERSION}"
                echo "tag=v${VERSION}"
              } >> "$GITHUB_OUTPUT"
            else
              echo "new_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ==========================================================================
  # Build Nix packages and push to Cachix binary cache
  # ==========================================================================
  # Nix cache must run AFTER semantic-release pushes the changelog commit
  # to main. semantic-release creates a tag then commits CHANGELOG.md +
  # Cargo.toml version bump back to main. `nix flake update` resolves to
  # that post-release main commit, not the tag. Building from the tag
  # produces derivation hashes that don't match what consumers fetch,
  # causing full rebuilds instead of cachix hits.
  nix-cache:
    name: Nix Cache
    needs: [semantic-release, publish]
    if: needs.semantic-release.outputs.new_release == 'true'
    uses: ./.github/workflows/nix.yml
    with:
      tag: main
    secrets:
      SCOPE_CREEP_CACHIX_PRIVATE_KEY: ${{ secrets.SCOPE_CREEP_CACHIX_PRIVATE_KEY }}

  # ==========================================================================
  # Build .deb packages for each architecture
  # ==========================================================================
  build:
    name: Build DEB ${{ matrix.arch }}
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            build_task: ci:build:deb
            rename_task: ci:release:rename-deb
          - arch: arm64
            runner: ubuntu-24.04-arm
            build_task: ci:build:deb:arm64
            rename_task: ci:release:rename-deb:arm64
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_REF_NAME: ${{ needs.semantic-release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "rust cargo:cargo-deb"
          cache: true

      - name: Build packages (with raised mlock limit for ProtectedAlloc)
        run: |
          sudo prlimit --pid $$ --memlock=268435456:268435456
          mise run ${{ matrix.build_task }}

      - run: mise run ${{ matrix.rename_task }}

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: "*.deb"
          retention-days: 1

  # ==========================================================================
  # Build .rpm packages for each architecture
  # ==========================================================================
  build-rpm:
    name: Build RPM ${{ matrix.arch }}
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            build_task: ci:build:rpm
            rename_task: ci:release:rename-rpm
          - arch: arm64
            runner: ubuntu-24.04-arm
            build_task: ci:build:rpm:arm64
            rename_task: ci:release:rename-rpm:arm64
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_REF_NAME: ${{ needs.semantic-release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "rust cargo:cargo-generate-rpm"
          cache: true

      - uses: crazy-max/ghaction-import-gpg@v7
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Export GPG signing key for cargo-generate-rpm
        run: |
          KEY_FILE="$(mktemp)"
          gpg --armor --export-secret-keys "${{ steps.gpg.outputs.keyid }}" > "$KEY_FILE"
          echo "GPG_SIGNING_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build packages (with raised mlock limit for ProtectedAlloc)
        run: |
          sudo prlimit --pid $$ --memlock=268435456:268435456
          mise run ${{ matrix.build_task }}

      - run: mise run ${{ matrix.rename_task }}

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}
          path: "*.rpm"
          retention-days: 1

  # ==========================================================================
  # Build Arch tarballs and .pkg.tar.zst packages for each architecture
  # ==========================================================================
  build-arch:
    name: Build Arch ${{ matrix.arch }}
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            build_task: ci:build:arch
          - arch: arm64
            runner: ubuntu-24.04-arm
            build_task: ci:build:arch:arm64
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_REF_NAME: ${{ needs.semantic-release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "rust"
          cache: true

      - name: Install Arch packaging tools
        run: mise run ci:setup:arch-repo

      - name: Build packages (with raised mlock limit for ProtectedAlloc)
        run: |
          sudo prlimit --pid $$ --memlock=268435456:268435456
          mise run ${{ matrix.build_task }}

      - uses: actions/upload-artifact@v7
        with:
          name: arch-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.pkg.tar.zst
          retention-days: 1

  # ==========================================================================
  # Generate build attestations for supply chain security
  # ==========================================================================
  attest:
    name: Attest Build Provenance
    needs: [semantic-release, build, build-rpm, build-arch]
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: rpm-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: arch-*
          merge-multiple: true

      - uses: actions/attest@v4
        with:
          subject-path: |
            *.deb
            *.rpm
            *.tar.gz
            *.pkg.tar.zst

  # ==========================================================================
  # Upload .deb and .rpm assets to GitHub Release
  # ==========================================================================
  upload-assets:
    name: Upload Release Assets
    needs: [semantic-release, build, build-rpm, build-arch]
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
      TAG: ${{ needs.semantic-release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: rpm-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: arch-*
          merge-multiple: true

      - name: Generate source tarball
        run: |
          git archive --format=tar.gz --prefix=open-sesame-${VERSION}/ \
            -o "open-sesame-${VERSION}-source.tar.gz" "${TAG}"

      - name: Generate checksums and install instructions
        run: ./scripts/release/generate-checksums.sh

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            *.deb
            *.rpm
            *.tar.gz
            *.pkg.tar.zst
            SHA256SUMS.txt
          body_path: install_instructions.md
          append_body: true

  # ==========================================================================
  # Build documentation (rustdoc + mdBook)
  # ==========================================================================
  build-docs:
    name: Build Documentation
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "rust"
          cache: true

      - run: mise run ci:docs:all

      - run: mise run ci:docs:combine

      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: combined-docs/
          retention-days: 1

  # ==========================================================================
  # Generate and deploy APT + DNF repositories and documentation to GitHub Pages
  # ==========================================================================
  publish:
    name: Publish Repositories & Docs
    needs: [semantic-release, build, build-rpm, build-arch, upload-assets, build-docs]
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: packages/
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: rpm-*
          path: packages/
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: arch-*
          path: packages/
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: documentation
          path: docs-site/

      - uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "rust"
          cache: true

      - name: Generate APT repository
        run: mise run ci:release:apt-repo

      - name: Generate RPM repository
        run: mise run ci:release:rpm-repo

      - name: Generate Arch repository
        run: mise run ci:release:arch-repo

      - name: Merge RPM and Arch repos into gh-pages
        run: |
          cp -r rpm-site/repo gh-pages/repo
          cp rpm-site/RPM-GPG-KEY gh-pages/RPM-GPG-KEY
          mkdir -p gh-pages/arch
          cp -rL arch-site/. gh-pages/arch/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages/

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployment
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: ./scripts/release/verify-deployment.sh

  # ==========================================================================
  # Publish AUR packages
  # ==========================================================================
  aur-publish:
    name: AUR Publish
    needs: [semantic-release, upload-assets]
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "rust"
          cache: true

      - name: Download SHA256SUMS.txt from release
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/SHA256SUMS.txt" -o SHA256SUMS.txt

      - name: Update PKGBUILD with version and checksums
        run: |
          export SHA256SUMS=SHA256SUMS.txt PKGBUILD_DIR=aur/open-sesame-bin
          ./scripts/arch/update-pkgbuild.sh

      - name: Publish open-sesame-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: open-sesame-bin
          asset_dir: aur/open-sesame-bin/
          commit_username: usrbinkat
          commit_email: usrbinkat@braincraft.io
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          test: true
          test_flags: --clean --cleanbuild --nodeps

  # ==========================================================================
  # Cleanup old releases (keep last 10)
  # ==========================================================================
  cleanup:
    name: Cleanup Old Releases
    needs: [semantic-release, publish]
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 10
          delete_tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
