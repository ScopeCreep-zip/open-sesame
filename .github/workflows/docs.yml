name: Docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      # The repository's .mise.toml is trusted in its own checkout.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: scopecreep-zip

      # The devshell provides the toolchain, the system libraries, and mdbook.
      - name: Build the documentation in the devshell
        run: nix develop --accept-flake-config -c mise run ci:docs
