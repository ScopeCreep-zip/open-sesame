name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

jobs:
  test:
    name: Test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "rust"
          cache: true

      - name: Run tests (with raised mlock limit for ProtectedAlloc)
        run: |
          sudo prlimit --pid $$ --memlock=268435456:268435456
          mise run ci:test

  qa:
    name: QA (TOML, Markdown, links, shell, workflows, dependencies)
    runs-on: ubuntu-24.04
    env:
      # The repository's .mise.toml is trusted in its own checkout.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: scopecreep-zip

      - name: Run QA tasks in the devshell
        run: nix develop --accept-flake-config -c mise run ci:qa

  lint-pkgbuild:
    name: Lint PKGBUILDs (namcap)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7

      - name: Lint PKGBUILDs
        run: ./scripts/arch/lint-pkgbuild.sh
