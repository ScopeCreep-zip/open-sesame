name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

jobs:
  test:
    name: Test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          install_args: "rust"
          cache: true

      - name: Run tests (with raised mlock limit for ProtectedAlloc)
        run: |
          sudo prlimit --pid $$ --memlock=268435456:268435456
          mise run ci:test

  lint-pkgbuild:
    name: Lint PKGBUILDs (namcap)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7

      - name: Install namcap
        run: pacman -Syu --noconfirm namcap

      - name: Lint binary PKGBUILD
        run: |
          cd aur/open-sesame-bin
          sed -i 's/^pkgver=VERSION$/pkgver=0.0.1/' PKGBUILD
          sed -i 's/HEADLESS_X86_64_SHA/SKIP/g; s/HEADLESS_AARCH64_SHA/SKIP/g; s/DESKTOP_X86_64_SHA/SKIP/g; s/DESKTOP_AARCH64_SHA/SKIP/g' PKGBUILD
          namcap PKGBUILD

      - name: Lint source PKGBUILD
        run: |
          cd aur/open-sesame
          sed -i 's/^pkgver=VERSION$/pkgver=0.0.1/' PKGBUILD
          sed -i 's/SOURCE_SHA/SKIP/g' PKGBUILD
          namcap PKGBUILD
