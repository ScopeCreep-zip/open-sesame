[package]
name = "daemon-profile"
description = "Profile orchestrator daemon: hosts IPC bus server, context evaluation, concurrent profile activation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["desktop"]
desktop = ["platform-linux/desktop"]

[dependencies]
core-types = { workspace = true }
core-config = { workspace = true }
core-daemon = { workspace = true }
core-layout = { workspace = true }
core-ipc = { workspace = true }
core-profile = { workspace = true }
# rt-multi-thread: `#[tokio::main]` runs the bus server on the
# multi-threaded runtime.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
rustix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
