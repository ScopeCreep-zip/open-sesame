[package]
name = "daemon-launcher"
description = "Application launcher daemon: desktop entry discovery, fuzzy search, per-profile frecency, profile-scoped launch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# GTK4 launcher UI.
gtk = ["dep:gtk4"]

[dependencies]
core-types = { workspace = true }
# The platform keyring factor of daemon-wm's inline unlock (KeyringUnlockRequest).
core-auth = { workspace = true }
core-config = { workspace = true }
core-daemon = { workspace = true }
core-ipc = { workspace = true }
core-fuzzy = { workspace = true }
core-layout = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
zeroize = { workspace = true }
freedesktop-desktop-entry = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { workspace = true }
gtk4 = { workspace = true, optional = true }
# The session bus connection holding the GlobalShortcuts portal session,
# and its activation stream.
zbus = { workspace = true }
futures-util = { workspace = true }
