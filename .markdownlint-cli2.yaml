# markdownlint-cli2 configuration
# https://github.com/DavidAnson/markdownlint-cli2

# Use .markdownlint.yaml for rule configuration
config: .markdownlint.yaml

# Build output and local state: whatever .gitignore excludes (target, docs/book,
# combined-docs, .direnv, node_modules, TASKS*.md, ...).
gitignore: true

# Tracked files not linted: generated by semantic-release, and HTML templates.
ignores:
  - "CHANGELOG.md"
  - ".github/templates/**"

# Globs to lint
globs:
  - "**/*.md"
