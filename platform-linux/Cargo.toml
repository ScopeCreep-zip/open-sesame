[package]
name = "platform-linux"
description = "Linux API wrappers: evdev, Wayland toplevel protocols, D-Bus (NetworkManager), Secret Service credential store, Landlock, seccomp, systemd notify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
desktop = [
  "dep:wayland-client",
  "dep:wayland-protocols",
  "dep:wayland-protocols-wlr",
  "dep:wl-clipboard-rs",
  "dep:evdev",
]
cosmic = [
  "desktop",
  "dep:cosmic-client-toolkit",
  "dep:cosmic-protocols",
  "dep:cosmic-theme",
  "dep:cosmic-config",
]

[target.'cfg(target_os = "linux")'.dependencies]
# Always available (headless-safe)
core-types = { workspace = true }
core-layout = { workspace = true }
zbus = { workspace = true }
ashpd = { workspace = true }
oo7 = { workspace = true }
landlock = { workspace = true }
libseccomp = { workspace = true }
sd-notify = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# fs: fstat; process: prctl, rlimits; event: poll; net: AF_UNIX for the
# seccomp socket-family rule.
rustix = { workspace = true, features = ["fs", "process", "event", "net"] }
futures-util = { workspace = true }
uuid = { workspace = true }

# Desktop-only (optional, behind `desktop` feature)
evdev = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
wayland-protocols-wlr = { workspace = true, optional = true }
wl-clipboard-rs = { workspace = true, optional = true }

# GPL-3.0 gated: feature-flagged to isolate license obligation
cosmic-client-toolkit = { workspace = true, optional = true }
cosmic-protocols = { workspace = true, optional = true }
cosmic-theme = { workspace = true, optional = true }
cosmic-config = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# tests/secret_service.rs: a Secret Service run in-process.
oo7-daemon = { workspace = true }
