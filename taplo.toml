# Taplo configuration for TOML formatting and linting
# https://taplo.tamasfe.dev/configuration/

# Exclude directories
exclude = [
  "target/**/*.toml",
  ".cargo/**/*.toml",
  "node_modules/**/*.toml",
  ".git/**/*.toml",
  ".cache/**/*.toml",
  "tmp/**/*.toml",
  # direnv flake-input copies (read-only /nix/store paths)
  ".direnv/**/*.toml",
]

[formatting]
# Don't align entries - keeps diffs cleaner
align_entries = false

# Don't align trailing comments - one comment's length must not reflow
# its neighbours (taplo default: true)
align_comments = false

# Keep trailing commas in arrays for cleaner diffs
array_trailing_comma = true

# Don't auto-expand arrays
array_auto_expand = false

# Don't auto-collapse arrays
array_auto_collapse = false

# No padding inside single-line arrays (taplo default). taplo 0.10 pads
# both brackets when false, which renders an empty array as `[  ]`.
compact_arrays = true

# Keep inline tables readable
compact_inline_tables = false

# Don't indent tables - keeps structure flat
indent_tables = false

# Don't indent entries under tables
indent_entries = false

# Don't reorder keys - preserve original order
reorder_keys = false

# Allow one blank line maximum
allowed_blank_lines = 1

# Use 2 spaces for indentation
indent_string = "  "

# Ensure trailing newline
trailing_newline = true

# Use LF line endings
crlf = false

# Schema validation
[schema]
enabled = true

# Cargo.toml schema
[[rule]]
include = ["Cargo.toml", "**/Cargo.toml"]
keys = ["package", "dependencies", "dev-dependencies", "build-dependencies", "features", "workspace"]

# mise.toml schema
[[rule]]
include = [".mise.toml", "mise.toml"]
keys = ["tools", "tasks", "env", "vars", "settings"]
